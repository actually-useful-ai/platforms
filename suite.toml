schema_version = 1

[suite]
id = "platforms"
name = "Platforms and Publishing Suite"
description = "Portable skills and read-only review agents for platform delivery and publishing."
version = "0.3.0"
author = "Luke Steuber"
repository = "https://github.com/actually-useful-ai/platforms"
license = "MIT"

[clients]
supported = ["claude", "cursor", "codex", "agents"]

